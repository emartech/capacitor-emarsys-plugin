<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Emarsys Capacitor Plugin</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#595959" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #fff;
      }

      #app {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      .safe-top {
        background: #595959;
        height: env(safe-area-inset-top, 20px);
        flex-shrink: 0;
      }

      .app-title {
        flex-shrink: 0;
        font-size: 18px;
        font-weight: 700;
        text-align: center;
        padding: 16px;
        background: #595959;
        color: #fff;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .tab-content {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .tab-pane {
        display: none;
        padding: 24px 16px;
        max-width: 420px;
        margin: 0 auto;
      }

      .tab-pane.active { display: block; }

      .page-title {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 20px 0;
      }

      .btn {
        display: block;
        width: 100%;
        padding: 14px 16px;
        margin-top: 12px;
        background: #595959;
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        border: none;
        border-radius: 8px;
        text-align: left;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .btn:active { opacity: 0.8; }

      .section-separator {
        border: none;
        border-top: 1px solid #ddd;
        margin: 24px 0 0 0;
      }

      .tab-bar {
        flex-shrink: 0;
        display: flex;
        border-top: 1px solid #ddd;
        background: #fff;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      .tab-btn {
        flex: 1;
        padding: 10px 4px 8px;
        font-size: 11px;
        font-weight: 600;
        text-align: center;
        background: none;
        border: none;
        border-top: 3px solid transparent;
        color: #999;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        -webkit-tap-highlight-color: transparent;
      }

      .tab-btn.active {
        color: #595959;
        border-top-color: #595959;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="safe-top"></div>
      <div class="app-title">Emarsys Capacitor Plugin</div>

      <div class="tab-content"></div>

      <div class="tab-bar">
        <button class="tab-btn active" data-tab="config">Config</button>
        <button class="tab-btn" data-tab="push">Push</button>
        <button class="tab-btn" data-tab="inapp">In-App</button>
        <button class="tab-btn" data-tab="geofence">Geofence</button>
        <button class="tab-btn" data-tab="inbox">Inbox</button>
      </div>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
