name: Run JS Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  js-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run eslint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
